<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Manager</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/site.js" type="module"></script>
        <script src="js/code.js" type="module"></script>
    </head>
    <body>
        <div class="hero-container">
            <div class="login-blobs" aria-hidden="true">
                <svg class="login-blob" focusable="false" viewBox="0 0 200 200">
                    <path d="M25 170C10 152 -1 105 0 81C2 56 11 34 34 22C56 11 107 3 135 12C162 21 194 58 199 78C204 98 184 114 166 133C148 151 117 183 93 190C70 196 41 188 25 170Z"></path>
                </svg>
            </div>
            <div class="hero-inner">
                <div class="hero-image">
                    <img src="images/Monke.png" alt="Monke">
                </div>
                <div class="login-container">
                    <div class="login-title">
                        Login to Contact Manager
                    </div>
                    <!-- Login Form, sent by js/code.js -->
                    <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
                        <div class="login-form">
                            <!-- Username field-->
                            <input
                            class="form-input"
                            type="text" 
                            id="username"
                            name="username"
                            placeholder="Username"
                            required
                            >
                            <!-- Password field-->
                            <input
                            class="form-input"
                            type="password" 
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                            >
                            <div class="login-row">
                                <!-- Remember me checkbox-->
                                <label class="remember-label" for="remember">
                                    <input
                                    class="remember-input"
                                    type="checkbox"
                                    id="remember"
                                    name="remember"
                                    >
                                    Remember Me
                                </label>
                                    <!-- Forgot password link-->
                                    <a href="api/resetpassword.php">Forgot Password?</a>
                            </div>
                            <!-- Why the last attempt failed, filled in by js/code.js-->
                            <p class="login-error" id="login-error" role="alert" hidden></p>
                            <!-- Login button-->
                            <button class="btn-primary" type="submit">Login</button>
                            <div class="login-divider">
                                <span>OR</span>
                            </div>
                            <!-- Sign up link-->
                            <a class="btn-primary" href="signup.html">Sign Up</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
