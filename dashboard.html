<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | Contact Manager</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/site.js" type="module"></script>
        <script src="js/code.js" type="text/javascript"></script>
        <script type="text/javascript">
            document.addEventListener('DOMContentLoaded', function() {
                readCookie();
            }, false);
        </script>
    </head>
    <body>
        <div class="dashboard-container" data-mobile-view="list">
            <div class="dashboard-inner">
                <div class="contact-list-section">
                    <div class="contact-list">
                        <div class="contact-list-header">
                            <h2>{ Contact Manager }</h2>
                        </div>
                        <!-- Contact list search input-->
                        <div class="contact-list-search">
                            <input class="contact-search-input" type="search" name="contact_search" placeholder="Search contacts">
                        </div>
                        <div class="contact-list-scroll" role="region" aria-label="Contacts" tabindex="0">
                            <!-- Contact list items, filled in by js/dashboard.js from the API-->
                            <ul class="contact-list-items">
                                <!-- Markup for one contact, cloned once per contact-->
                                <template id="contact-list-item-template">
                                    <li class="contact-list-entry">
                                        <button class="contact-list-item" type="button">
                                            <span class="contact-list-avatar" aria-hidden="true"></span>
                                            <span class="contact-list-name">
                                                <span class="contact-list-name-text"></span>
                                            </span>
                                            <span class="contact-list-chevron" aria-hidden="true">&#8250;</span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                            <!-- spacer-->
                            <div class="contact-list-spacer"></div>
                        </div>
                    </div>
                    <!-- Fixed add contact action-->
                    <div class="contact-list-add">
                        <button class="btn-add-contact" type="button" aria-label="Add contact" title="Add contact">
                            <svg class="add-contact-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                                <path d="M12 5v14M5 12h14"></path>
                            </svg>
                            <span class="btn-add-contact-text">Add contact</span>
                        </button>
                    </div>
                    <div class="contact-list-logout">
                        <!-- Logout form-->
                        <form onsubmit="doLogout();">
                            <button class="btn-primary logout-button" type="submit">Logout</button>
                        </form>
                    </div>
                </div>
                <!-- dashboard section-->
                <div class="contact-details">
                    <!-- contact details view showing info reated to the selected contact, filled in by js/dashboard.js-->
                    <article class="contact-details-view contact-workspace-panel" aria-labelledby="contact-view-heading" hidden>
                        <button class="mobile-back-button" type="button" data-mobile-target="list">
                            <span aria-hidden="true">&larr;</span>
                            Back to contacts
                        </button>
                        <div class="contact-panel-heading">
                            <h2 id="contact-view-heading">{ Contact }</h2>
                        </div>
                        <header class="contact-view-identity">
                            <div class="contact-view-avatar" id="contact-view-initials" aria-hidden="true"></div>
                            <div class="contact-view-title">
                                <h3 id="contact-view-name"></h3>
                                <dl class="contact-view-meta">
                                    <div class="contact-view-meta-item">
                                        <dt>Contact since</dt>
                                        <dd><time id="contact-view-created"></time></dd>
                                    </div>
                                </dl>
                            </div>
                        </header>
                        <ul class="contact-view-fields">
                            <li class="contact-view-field">
                                <!-- Copy email button-->
                                <button class="contact-view-copy" type="button" aria-label="Copy email address" title="Copy email address">
                                    <svg class="contact-view-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path d="M3 6h18v12H3zM3 7l9 7 9-7"></path>
                                    </svg>
                                    <svg class="contact-view-copied-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path d="M5 12l5 5 9-10"></path>
                                    </svg>
                                </button>
                                <!-- Display email address-->
                                <span class="contact-view-field-text">
                                    <span class="contact-view-label">Email address</span>
                                    <span class="contact-view-value" id="contact-view-email"></span>
                                </span>
                                <!-- Send email button-->
                                <a class="contact-view-field-action" id="contact-view-email-link" href="mailto:" aria-label="Send email">
                                    <span class="contact-view-field-action-text">Email</span>
                                    <span class="contact-view-field-action-arrow" aria-hidden="true">&#8599;</span>
                                </a>
                            </li>
                            <li class="contact-view-field">
                                <!-- Copy phone number button-->
                                <button class="contact-view-copy" type="button" aria-label="Copy phone number" title="Copy phone number">
                                    <svg class="contact-view-copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path d="M7 3H4.5A1.5 1.5 0 003 4.5C3 13.6 10.4 21 19.5 21a1.5 1.5 0 001.5-1.5V17l-5-1-1.2 3a15.8 15.8 0 01-9.8-9.8L8 8 7 3z"></path>
                                    </svg>
                                    <svg class="contact-view-copied-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                        <path d="M5 12l5 5 9-10"></path>
                                    </svg>
                                </button>
                                <!-- Display phone number-->
                                <span class="contact-view-field-text">
                                    <span class="contact-view-label">Phone number</span>
                                    <span class="contact-view-value" id="contact-view-phone"></span>
                                </span>
                                <!-- Call phone number button-->
                                <a class="contact-view-field-action" id="contact-view-phone-link" href="tel:" aria-label="Call phone number">
                                    <span class="contact-view-field-action-text">Call</span>
                                    <span class="contact-view-field-action-arrow" aria-hidden="true">&#8599;</span>
                                </a>
                            </li>
                        </ul>
                        <div class="contact-view-footer">
                            <button class="btn-contact-edit" id="edit-contact-button" type="button">Edit contact</button>
                        </div>
                        <p class="visually-hidden" id="copy-status" aria-live="polite"></p>
                    </article>

                    <!-- Editing is a deliberate mode so destructive actions stay out of the read-only view. -->
                    <section class="contact-edit-form contact-workspace-panel" aria-labelledby="contact-edit-heading" hidden>
                        <button class="mobile-back-button edit-back-button" type="button">
                            <span aria-hidden="true">&larr;</span>
                            Back to contact
                        </button>
                        <div class="contact-panel-heading">
                            <h2 id="contact-edit-heading">{ Edit Contact }</h2>
                        </div>
                        <form class="contact-form" id="edit-contact-form">
                            <div class="contact-form-fields">
                                <div class="contact-form-field">
                                    <label for="edit-first-name">First name</label>
                                    <input type="text" name="first_name" id="edit-first-name" class="form-input" autocomplete="given-name" required>
                                </div>
                                <div class="contact-form-field">
                                    <label for="edit-last-name">Last name</label>
                                    <input type="text" name="last_name" id="edit-last-name" class="form-input" autocomplete="family-name" required>
                                </div>
                                <div class="contact-form-field">
                                    <label for="edit-email">Email address</label>
                                    <input type="email" name="email" id="edit-email" class="form-input" autocomplete="email">
                                </div>
                                <div class="contact-form-field">
                                    <label for="edit-phone">Phone number</label>
                                    <input type="tel" name="phone" id="edit-phone" class="form-input" autocomplete="tel">
                                </div>
                            </div>
                            <div class="contact-form-footer contact-edit-actions">
                                <button class="btn-primary" type="submit">Save changes</button>
                                <button class="btn-contact-cancel" id="cancel-edit-button" type="button">Cancel</button>
                            </div>
                            <p class="contact-form-status" id="edit-contact-status" aria-live="polite"></p>
                        </form>
                        <div class="contact-form-danger">
                            <button class="btn-delete-contact" type="button" id="delete-contact-button">
                                <svg class="delete-contact-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                                    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path>
                                </svg>
                                Delete contact
                            </button>
                        </div>
                    </section>

                    <!-- contact details form used for adding new contacts, shown when the addd contact button is clicked-->
                    <section class="contact-details-form contact-workspace-panel" aria-labelledby="contact-add-heading">
                        <button class="mobile-back-button" type="button" data-mobile-target="list">
                            <span aria-hidden="true">&larr;</span>
                            Back to contacts
                        </button>
                        <div class="contact-panel-heading">
                            <h2 id="contact-add-heading">{ New Contact }</h2>
                        </div>
                        <!-- Contact form fields-->
                        <form class="contact-form" id="add-contact-form">
                            <div class="contact-form-fields">
                                <!-- First name field-->
                                <div class="contact-form-field">
                                    <label for="first-name">First name</label>
                                    <input type="text" name="first_name" id="first-name" class="form-input" placeholder="" autocomplete="given-name" required>
                                </div>
                                <!-- Last name field-->
                                <div class="contact-form-field">
                                    <label for="last-name">Last name</label>
                                    <input type="text" name="last_name" id="last-name" class="form-input" placeholder="" autocomplete="family-name" required>
                                </div>
                                <!-- Email address field-->
                                <div class="contact-form-field">
                                    <label for="email">Email address</label>
                                    <input type="email" name="email" id="email" class="form-input" placeholder="" autocomplete="email">
                                </div>
                                <!-- Phone number field-->
                                <div class="contact-form-field">
                                    <label for="phone">Phone number</label>
                                    <input type="tel" name="phone" id="phone" class="form-input" placeholder="" autocomplete="tel">
                                </div>
                            </div>
                            <!-- Add contact button-->
                            <div class="contact-form-footer">
                                <button class="btn-primary" type="submit">Add contact</button>
                            </div>
                            <p class="contact-form-status" id="add-contact-status" aria-live="polite"></p>
                        </form>
                    </section>
                    <div class="contact-details-bottom-border"></div>
                </div>
            </div>
        </div>

        <dialog
            class="delete-contact-dialog"
            id="delete-contact-dialog"
            aria-label="Delete contact confirmation"
            aria-describedby="delete-dialog-description delete-dialog-warning"
        >
            <div class="delete-dialog-content">
                <p id="delete-dialog-description">
                    <strong id="delete-dialog-contact-name"></strong> will be permanently removed.
                </p>
                <p class="delete-dialog-warning" id="delete-dialog-warning">This action cannot be undone.</p>
                <p class="delete-dialog-status" id="delete-dialog-status" aria-live="polite"></p>
            </div>
            <form class="delete-dialog-actions" method="dialog">
                <button class="btn-dialog-cancel" type="submit" value="cancel" autofocus>Cancel</button>
                <button class="btn-dialog-delete" id="confirm-delete-contact-button" type="button">Delete contact</button>
            </form>
        </dialog>
    </body>
</html>
